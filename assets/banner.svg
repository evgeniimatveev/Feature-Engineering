<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Feature Engineering banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a24"/>
      <stop offset="0.6" stop-color="#11524a"/>
      <stop offset="1" stop-color="#1a8f7a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <!-- decorative pipeline: raw -> clean -> scale -> encode -> select -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#eafff9" text-anchor="middle">
    <g transform="translate(900 52)">
      <rect width="300" height="44" rx="10" fill="url(#box)" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="150" y="28">raw data</text>
      <path d="M150 48 v22" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <rect y="74" width="300" height="44" rx="10" fill="url(#box)" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="150" y="102">impute · clean outliers</text>
      <path d="M150 122 v22" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <rect y="148" width="300" height="44" rx="10" fill="url(#box)" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="150" y="176">scale · encode · transform</text>
      <path d="M150 196 v22" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <rect y="222" width="300" height="44" rx="10" fill="url(#box)" stroke="#ffd166" stroke-opacity="0.8"/>
      <text x="150" y="250" fill="#ffd166">features ready for a model</text>
    </g>
  </g>
  <!-- title -->
  <text x="64" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffd166" letter-spacing="6">DATA PREPROCESSING</text>
  <text x="62" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff">Feature Engineering</text>
  <text x="64" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#d6fff4">Cleaning  ·  Scaling  ·  Encoding  ·  Interactions  ·  Pipelines</text>
</svg>
